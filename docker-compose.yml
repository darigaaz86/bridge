services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_INDEXER_API_URL: ${NEXT_PUBLIC_INDEXER_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_INDEXER_UI_URL: ${NEXT_PUBLIC_INDEXER_UI_URL:-http://localhost:8080}
      NEXT_PUBLIC_AGGREGATOR_ETHEREUM: ${NEXT_PUBLIC_AGGREGATOR_ETHEREUM:-}
      NEXT_PUBLIC_AGGREGATOR_ARBITRUM: ${NEXT_PUBLIC_AGGREGATOR_ARBITRUM:-}
      NEXT_PUBLIC_AGGREGATOR_BASE: ${NEXT_PUBLIC_AGGREGATOR_BASE:-}
      NEXT_PUBLIC_AGGREGATOR_OPTIMISM: ${NEXT_PUBLIC_AGGREGATOR_OPTIMISM:-}
      NEXT_PUBLIC_AGGREGATOR_POLYGON: ${NEXT_PUBLIC_AGGREGATOR_POLYGON:-}
      NEXT_PUBLIC_AGGREGATOR_AVALANCHE: ${NEXT_PUBLIC_AGGREGATOR_AVALANCHE:-}

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://qorebridge:${POSTGRES_PASSWORD:-changeme}@db:5432/qorebridge?sslmode=disable
      CHAINS: ${CHAINS:-[]}
      POLL_INTERVAL: ${POLL_INTERVAL:-10}
      STATUS_POLL_INTERVAL: ${STATUS_POLL_INTERVAL:-10}
      API_PORT: ${API_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qorebridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: qorebridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qorebridge"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
