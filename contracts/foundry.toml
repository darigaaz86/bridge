[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true

[fuzz]
runs = 256

# Testnet RPC endpoints (used by --rpc-url aliases)
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
arb_sepolia = "${ARB_SEPOLIA_RPC_URL}"
eth_sepolia = "${ETH_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_RPC_URL}"

# Etherscan API keys for contract verification
[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }
arb_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api", chain = 421614 }
eth_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api", chain = 11155111 }
